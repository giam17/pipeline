name: Deploy pagin estatica en pages

on:
  push:
      branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concureency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      -name: Checkout
       uses: actions/checkout@v6

      -name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Carga artifacts
        uses: actions/upload-pages-artifact@v4
        with:
            path: "."

      - name: Despleglar en GitHub Pages
        id : deployment
        uses: actions/deploy-pages@v4